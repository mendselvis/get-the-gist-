<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- one solid #111 slide with the play triangle cut out (transparent), bold enough to read at 16px -->
  <defs>
    <mask id="play-cutout">
      <rect width="32" height="32" fill="#fff" />
      <path d="M13.4 10.6 L22.2 16 L13.4 21.4 Z" fill="#000" stroke="#000" stroke-width="1.6" stroke-linejoin="round" />
    </mask>
  </defs>
  <rect x="1.5" y="4.5" width="29" height="23" rx="5.5" fill="#111111" mask="url(#play-cutout)" />
</svg>
